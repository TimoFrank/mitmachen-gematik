name: Kernprüfungen

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: core-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core-check:
    name: Kernprüfung
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Geprüften Quellstand auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Node.js 22 einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Quellen und Syntax prüfen
        run: npm run qa:small

      - name: Import und Herkunft prüfen
        run: npm run verify:import

  target-readiness:
    name: Target-Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Geprüften Quellstand auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Node.js 22 einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Prüfwerkzeuge bestätigen
        shell: bash
        run: |
          set -euo pipefail
          for tool in docker gpg openssl git; do
            command -v "$tool" >/dev/null
          done
          docker info >/dev/null

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Chromium und Systemabhängigkeiten installieren
        run: npx --no-install playwright install --with-deps chromium

      - name: API, Datenbank, OIDC, Container und Oberfläche prüfen
        env:
          API_BASE_URL: https://target.example.invalid
          TARGET_AUTH_MODE: oidc
        run: npm run qa:full

      - name: Helm einrichten
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.19.0

      - name: Target-Konfiguration linten und rendern
        shell: bash
        run: |
          set -euo pipefail
          chart='deploy/helm/versorgungs-kompass'
          image_digest='sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'
          helm lint "$chart" \
            --values "$chart/values-target-gematik.yaml" \
            --set-string image.digest="$image_digest"
          helm template core-readiness "$chart" \
            --namespace versorgungs-kompass-target \
            --values "$chart/values-target-gematik.yaml" \
            --set-string image.digest="$image_digest" \
            >"$RUNNER_TEMP/versorgungs-kompass-target.yaml"
          test -s "$RUNNER_TEMP/versorgungs-kompass-target.yaml"

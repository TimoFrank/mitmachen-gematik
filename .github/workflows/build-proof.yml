name: Build-Probelauf

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-proof
  cancel-in-progress: false

jobs:
  package:
    name: Paket bauen und starten
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Integrierten Quellstand verlangen
        env:
          SELECTED_REF: ${{ github.ref }}
        run: test "$SELECTED_REF" = refs/heads/main

      - name: Quellstand auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Node.js 22 einrichten
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Prüfwerkzeuge vorbereiten
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium

      - name: Quellbestand prüfen
        run: npm run verify:import

      - name: Anwendungspaket bauen
        run: npm run package:proof

      - name: Paketpfad ermitteln
        id: archive
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { appendFileSync, readdirSync } from 'node:fs';
          import path from 'node:path';
          const files = readdirSync('dist/local-proof').filter(file => file.endsWith('.tar.gz'));
          assert.equal(files.length, 1, 'Es wird genau ein neues Anwendungspaket erwartet.');
          appendFileSync(process.env.GITHUB_OUTPUT, 'file=' + path.resolve('dist/local-proof', files[0]) + '\n');
          JS

      - name: Entpacktes Paket mit synthetischen Daten starten und prüfen
        env:
          PACKAGE_FILE: ${{ steps.archive.outputs.file }}
        run: npm run test:package -- "$PACKAGE_FILE"

      - name: Geprüftes Probelaufpaket bereitstellen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mitmachen-gematik-probelauf-${{ github.sha }}
          path: |
            dist/local-proof/*.tar.gz
            dist/local-proof/*.sha256
            dist/local-proof/*-report.json
            dist/local-proof/*.png
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

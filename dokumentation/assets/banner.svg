      <path d="M24 11 19 53M44 11l-5 42" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
      <path d="M12 25h41M10 41h41" fill="none" stroke="#00FF65" stroke-width="7" stroke-linecap="round"/>
    </g>
    <text x="112" y="75" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.4">Mitmachen</text>
  </g>
  <text x="1158" y="72" text-anchor="end" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="23">Zwei Kompasse. Eine gemeinsame Grundlage.</text>
  <path d="M36 126h1128" fill="none" stroke="#00D95A" stroke-width="4" stroke-linecap="round"/>
  <rect x="36" y="160" width="548" height="216" rx="16" fill="#0B5CAD"/>
  <rect x="616" y="160" width="548" height="216" rx="16" fill="#A84C16"/>
  <path d="M54 160h512" fill="none" stroke="#2788F6" stroke-width="6" stroke-linecap="round"/>
  <path d="M634 160h512" fill="none" stroke="#E0A44D" stroke-width="6" stroke-linecap="round"/>

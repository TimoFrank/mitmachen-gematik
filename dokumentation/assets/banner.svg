<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="418" viewBox="0 0 1200 418" role="img" aria-labelledby="title description">
  <title id="title">#Mitmachen mit zwei Kompassen</title>
  <desc id="description">Versorgungs-Kompass und Hospitations-Kompass unter dem gemeinsamen Absender #Mitmachen. Beide verbinden Versorgungsarbeit und Hospitationen auf einer gemeinsamen Grundlage.</desc>
  <defs>
    <linearGradient id="banner-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#010E52"/>
      <stop offset="1" stop-color="#10236E"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="418" rx="20" fill="url(#banner-background)"/>
  <!-- Markenquellen: public/brand/mitmachen/lockup-horizontal-on-dark.svg, public/brand/versorgungs-kompass/lockup-horizontal-on-dark.svg, public/brand/modules/hospitation/lockup-horizontal-on-dark.svg. -->
  <g transform="translate(28 12) scale(.88)">
